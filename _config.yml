title: Open RBQM Centralized Monitoring Job Aid
description: Guidance for Central Monitors performing review of GSM centralized monitoring output
theme: just-the-docs

url: "https://gilead-biostats.github.io"
baseurl: "/gsm.guide"

# Footer
gh_edit_link: false

# Aux links (top right)
aux_links:
  "GSM on GitHub":
    - "https://github.com/Gilead-BioStats/gsm"

aux_links_new_tab: true

# Color scheme
color_scheme: light

# Search
search_enabled: true
search.heading_level: 3

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Callouts
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
  example:
    title: Example
    color: purple

exclude:
  - "*.docx"
  - README.md
